[workspace]
resolver = "2"
members = ["core_rs"]

[workspace.package]
version = "0.0.2"
license = "MIT OR Apache-2.0"
repository = "https://github.com/MAKHMUDuz/melyar"
homepage = "https://github.com/MAKHMUDuz/melyar"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.38", features = ["full", "rt-multi-thread", "macros"] }
# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2", "stream", "gzip", "cookies"] }
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Error handling
anyhow = "1.0"
thiserror = "1.0"
# CXX FFI bridge
cxx = "1.0"
cxx-build = "1.0"
# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# SQLite
rusqlite = { version = "0.31", features = ["bundled", "modern_sqlite", "extra_check"] }
# D-Bus MPRIS
zbus = { version = "4.4", features = ["tokio"] }
# Audio - libmpv
libmpv-sys = "3.1.0"
# LRU cache
lru = "0.12"
# Time
chrono = { version = "0.4", features = ["serde"] }
# Regex for cipher parsing
regex = "1.10"
# URL parsing
url = "2.5"
# Base64
base64 = "0.21"
# Hex
hex = "0.4"
# URL encoding
urlencoding = "2.1"
# Random
rand = "0.8"
# Once cell
once_cell = "1.19"
