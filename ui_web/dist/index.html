<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0d0f" />
    <title>Melyar</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script src="./qwebchannel.js"></script>
    <script type="module" crossorigin src="./assets/index-BGeAHvhl.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DnP1bHYU.css">
  </head>
  <body>
    <div id="root"></div>

    <!-- SVG Filter Definitions for Liquid Glass Displacement Effect -->
    <svg class="filter-svg" aria-hidden="true">
      <defs>
        <!-- Convex Squircle Displacement Map (vue-web-liquid-glass style) -->
        <filter id="glass-displacement" x="-50%" y="-50%" width="200%" height="200%">
          <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" result="noise" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="8" xChannelSelector="R" yChannelSelector="G" />
          <feGaussianBlur stdDeviation="0.5" />
          <feColorMatrix type="saturate" values="1.1" />
        </filter>

        <!-- Subtle Glass Magnification -->
        <filter id="glass-magnify" x="-20%" y="-20%" width="140%" height="140%">
          <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="2" result="noise" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G" />
          <feGaussianBlur stdDeviation="0.3" />
        </filter>

        <!-- Specular Highlight -->
        <filter id="glass-specular" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur" />
          <feSpecularLighting surfaceScale="5" specularConstant="1" specularExponent="20" lighting-color="#ffffff" result="specOut">
            <!-- fePointLight does not accept percentages (SVG filter primitives
                 use unitless numbers in objectBoundingBox units) -->
            <fePointLight x="0.5" y="-1" z="200" />
          </feSpecularLighting>
          <feComposite in="specOut" in2="SourceAlpha" operator="in" result="specOut" />
          <feComposite in="SourceGraphic" in2="specOut" operator="arithmetic" k1="0" k2="1" k3="1" k4="0" />
        </filter>

        <!-- Inner Glow -->
        <filter id="glass-inner-glow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur" />
          <feFlood flood-color="white" flood-opacity="0.15" result="glow" />
          <feComposite in="glow" in2="blur" operator="in" result="glow" />
          <feComposite in="SourceGraphic" in2="glow" operator="over" />
        </filter>
      </defs>
    </svg>
  </body>
</html>
