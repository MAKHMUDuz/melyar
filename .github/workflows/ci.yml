name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-core:
    name: Rust core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libmpv-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --manifest-path core_rs/Cargo.toml --all-targets -- -D warnings

      - name: Build
        run: cargo build --manifest-path core_rs/Cargo.toml --release

  web-ui:
    name: Web UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui_web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # pnpm 10+ is required: the project uses the `allowBuilds` setting
          # in pnpm-workspace.yaml to permit esbuild's postinstall script.
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: ui_web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Check the committed bundle is up to date
        # The bundle is committed so that a plain cmake build produces a
        # runnable binary. A contributor who rebuilds it from a checkout that
        # is not up to date would commit a bundle that does not match the
        # sources, so the build is repeated here and the result compared.
        # The pathspec is anchored to the repository root, because this job
        # runs in ui_web.
        run: |
          if ! git diff --quiet -- ':(top)ui_web/dist'; then
            echo "::error::ui_web/dist does not match the sources."
            echo "Run 'cd ui_web && pnpm build' and commit the result."
            git diff --stat -- ':(top)ui_web/dist'
            exit 1
          fi

      - name: Check every locale has the same keys
        # A missing key shows the key itself in the interface, so the files
        # have to stay in step with en.ts.
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const dir = path.join(process.cwd(), "src", "locales");
            const keysOf = (file) => {
              const text = fs.readFileSync(file, "utf8");
              return new Set([...text.matchAll(/"([a-zA-Z.]+)":/g)].map((m) => m[1]));
            };
            const reference = keysOf(path.join(dir, "en.ts"));
            let failed = false;
            for (const file of fs.readdirSync(dir).filter((f) => f.endsWith(".ts"))) {
              const keys = keysOf(path.join(dir, file));
              const missing = [...reference].filter((k) => !keys.has(k));
              const extra = [...keys].filter((k) => !reference.has(k));
              if (missing.length || extra.length) {
                failed = true;
                console.log(`::error::${file} is out of step with en.ts`);
                if (missing.length) console.log(`  missing: ${missing.join(", ")}`);
                if (extra.length) console.log(`  extra: ${extra.join(", ")}`);
              }
            }
            if (failed) process.exit(1);
            console.log("every locale matches en.ts");
          '

  desktop-app:
    name: Desktop app (Qt6)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake pkg-config ninja-build \
            qt6-base-dev qt6-declarative-dev qt6-webengine-dev qt6-webchannel-dev \
            libmpv-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j$(nproc)

  ui-audit:
    name: Interface audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake pkg-config xvfb \
            qt6-base-dev qt6-declarative-dev qt6-webengine-dev qt6-webchannel-dev \
            libmpv-dev \
            qml6-module-qtquick \
            qml6-module-qtquick-controls \
            qml6-module-qtquick-dialogs \
            qml6-module-qtquick-layouts \
            qml6-module-qtquick-templates \
            qml6-module-qtquick-window \
            qml6-module-qtqml-workerscript \
            qml6-module-qtwebengine \
            qml6-module-qtwebchannel

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Build
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)

      - name: Audit the interface
        # Drives the application through every view and every overlay and
        # fails when something is wrong with the interface: a console error,
        # an element reaching outside the window, a translation key that was
        # never replaced, an interactive element without an accessible name.
        #
        # It runs at several window sizes, because a layout that holds
        # together on a wide screen can still break on a small one.
        run: |
          set -uo pipefail

          FAILED=0
          for GEOMETRY in 1360x860 1200x760 1000x640; do
            echo "--- auditing at ${GEOMETRY} ---"
            xvfb-run -a --server-args="-screen 0 1920x1080x24" \
              env MELYAR_LANG=en \
                  MELYAR_WINDOW_GEOMETRY="${GEOMETRY}" \
                  MELYAR_EVAL_FILE=scripts/ui-audit.js \
                  MELYAR_EVAL_DELAY=1500 \
                  ./build/melyar > "audit-${GEOMETRY}.log" 2>&1 || true

            grep -E "DENETIM_SONUCU|SORUN" "audit-${GEOMETRY}.log" || true

            if ! grep -q "DENETIM_SONUCU problems=0" "audit-${GEOMETRY}.log"; then
              echo "::error::The interface audit did not finish at ${GEOMETRY}."
              tail -40 "audit-${GEOMETRY}.log"
              FAILED=1
              continue
            fi
            if grep -q "  SORUN: " "audit-${GEOMETRY}.log"; then
              echo "::error::The interface audit reported problems at ${GEOMETRY}."
              FAILED=1
            fi
          done

          exit "$FAILED"

      - name: Check the memory budget
        # The application is supposed to be light. This measures what it
        # actually uses, so a change that costs fifty megabytes cannot be
        # merged without someone deciding that it is worth it.
        run: |
          set -uo pipefail

          xvfb-run -a --server-args="-screen 0 1920x1080x24" \
            env MELYAR_LANG=en ./build/melyar > memory.log 2>&1 &
          RUNNER_PID=$!

          # Give the interface time to come up, then measure.
          sleep 15
          APP_PID=$(pgrep -x melyar | head -1 || true)
          if [ -z "$APP_PID" ]; then
            echo "::error::The application did not start."
            cat memory.log
            exit 1
          fi

          MEASUREMENT=$(python3 scripts/memory.py "$APP_PID")
          echo "$MEASUREMENT"

          PSS_KB=$(echo "$MEASUREMENT" | sed -n 's/.*pss=\([0-9]*\) .*/\1/p')
          BUDGET_KB=$((400 * 1024))

          kill "$APP_PID" 2>/dev/null || true
          wait "$RUNNER_PID" 2>/dev/null || true

          if [ -z "$PSS_KB" ]; then
            echo "::error::Could not read the memory usage."
            exit 1
          fi

          PSS_MB=$((PSS_KB / 1024))
          echo "the application uses ${PSS_MB} MB, the budget is $((BUDGET_KB / 1024)) MB"

          if [ "$PSS_KB" -gt "$BUDGET_KB" ]; then
            echo "::error::The application uses ${PSS_MB} MB, which is over the budget."
            exit 1
          fi

  debian-package:
    name: Debian package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            dpkg-dev debhelper fakeroot build-essential \
            cmake pkg-config \
            qt6-base-dev qt6-declarative-dev qt6-webengine-dev qt6-webchannel-dev \
            libmpv-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Build the package
        # The dependency check is skipped because rustc and cargo come from
        # rustup, which dpkg does not know about. Every other build
        # dependency is installed above.
        run: dpkg-buildpackage -d -us -uc -b

      - name: Check the package
        run: |
          DEB=$(ls ../melyar_*_amd64.deb)
          ls -la "$DEB"
          dpkg-deb --info "$DEB"
          # sed instead of head: head closes the pipe and makes tar fail.
          dpkg-deb --contents "$DEB" | sed -n '1,20p'

      - name: Free the disk
        # The Rust build tree is several gigabytes and the runner does not
        # have the room to unpack the package next to it.
        run: |
          rm -rf build target
          sudo apt-get clean
          df -h /

      - name: Unpack the package and check the files
        # Unpacking does not resolve the dependencies, so it works without
        # the runtime Qt packages being on the runner.
        run: |
          rm -rf package-root
          mkdir package-root
          DEB=$(ls ../melyar_*_amd64.deb)
          dpkg-deb -x "$DEB" package-root
          test -x package-root/usr/bin/melyar
          test -f package-root/usr/share/melyar/web/index.html
          test -f package-root/usr/share/applications/melyar.desktop
          test -f package-root/usr/share/icons/hicolor/scalable/apps/melyar.svg
          ls package-root/usr/share/melyar/web

      - name: Upload the package
        run: cp ../melyar_*_amd64.deb .

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: deb
          path: melyar_*.deb
          if-no-files-found: error
