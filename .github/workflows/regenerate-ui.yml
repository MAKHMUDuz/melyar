name: Regenerate web bundle
on:
  push:
    branches: [perf/isolate-cxx-bridge-build]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui_web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui_web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: regenerated-ui-dist
          path: ui_web/dist/
          if-no-files-found: error
