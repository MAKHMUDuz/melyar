[package]
name = "melyar_core"
version.workspace = true
edition = "2021"
rust-version = "1.88"
description = "Melyar ultra-lightweight music client core engine"
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
name = "melyar_core"
# rlib lets the examples and integration tests link against the core.
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
cxx-build = "1.0"

[dependencies]
# Workspace dependencies inherited
tokio = { workspace = true, features = ["full", "rt-multi-thread", "macros"] }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
cxx = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rusqlite = { workspace = true }
zbus = { workspace = true }
libmpv-sys = { workspace = true }
lru = { workspace = true }
chrono = { workspace = true }
regex = { workspace = true }
url = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }

# Additional core deps
parking_lot = "0.12"
dashmap = "5.5"
futures = "0.3"
async-trait = "0.1"
bytes = "1.5"
tokio-stream = { version = "0.1", features = ["sync"] }
dirs = "5.0"
urlencoding = { workspace = true }
rand = { workspace = true }
once_cell = { workspace = true }
